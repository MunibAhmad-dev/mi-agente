# Config de ejemplo para el proxy nativo de LiteLLM (Puente 1 del documento de
# integración AI-OS). Se levanta como servicio propio, independiente de AI-OS y
# de LibreChat:
#
#   litellm --config integrations/litellm/config.yaml --port 4000
#
# LibreChat lo consume como "custom endpoint" 100% compatible con OpenAI (ver
# la entrada 'LiteLLM (AI-OS Gateway)' en librechat.yaml).
#
# Reemplaza esto al bug de prioridad de AI-OS (_migrate_add_priority_column
# nunca se llama desde init_db()): en vez de una tabla de prioridad propia,
# aquí la prioridad y el fallback por salud los resuelve el Router de LiteLLM
# de forma nativa.
#
# QUÉ MODELOS ACTIVAR: ver integrations/litellm/SELECCION_MODELOS.md — cada
# bloque de abajo corresponde a una fila de esa tabla. Los marcados "Usar"
# van descomentados aquí; el resto queda comentado (no se borra).

model_list:
  # ============================================================
  # Rol: aios-principal (tareas complejas / reasoning)
  # order=1 se intenta primero; si falla o entra en cooldown, pasa a order=2, etc.
  # ============================================================

  # --- Anthropic - claude-sonnet-4-5 (order 1) - USAR ---
  - model_name: aios-principal
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      order: 1

  # --- OpenAI - gpt-4o (order 2, fallback) - EVALUANDO ---
  - model_name: aios-principal
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      order: 2

