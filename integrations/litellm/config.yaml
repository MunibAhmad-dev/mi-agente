# Cooldown y health checks: esto es lo que reemplaza el "fallback automatico
# de prioridad por salud/rol" que AI-OS intenta (y hoy falla) construir a mano.
router_settings:
  cooldown_time: 60          # segundos que un deployment queda fuera de rotacion tras fallar
  allowed_fails_policy:
    AuthenticationErrorAllowedFails: 0   # fuera de rotacion inmediato si falla la API key
    TimeoutErrorAllowedFails: 2          # fuera de rotacion al 3er timeout
    RateLimitErrorAllowedFails: 5        # fuera de rotacion al 6to 429

general_settings:
  background_health_checks: true   # pings periodicos por deployment
  health_check_interval: 30        # segundos entre pings
  # master_key: os.environ/LITELLM_MASTER_KEY   # descomentar para proteger el proxy
