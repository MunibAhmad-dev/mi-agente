# LiteLLM Gateway Configuration
# ================================================
# Configuración centralizada para todos los
# proveedores de LLM con enrutamiento inteligente

# ---- CONFIGURACIÓN GENERAL ----
general_settings:
  # Nombre del deployment
  master_key: os.environ/LITELLM_MASTER_KEY
  
  # UI Admin
  admin_key: os.environ/LITELLM_ADMIN_KEY
  
  # Database
  database_url: os.environ/DATABASE_URL
  
  # Redis
  redis_url: os.environ/REDIS_URL
  
  # CORS
  allow_cORS: true
  CORS_ALLOW_ORIGINS: "*"
  
  # Max parallel requests
  max_parallel_requests: 100
  
  # Health check
  health_check: true
  
  # Store all requests (audit)
  store_model_inference_input: true
  store_model_inference_output: true

