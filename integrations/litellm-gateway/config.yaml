# ---- GRUPOS DE MODELOS (Alias) ----
# Enrutamiento por rol
router_settings:
  model_group_alias:
    # Chat general
    chat:
      - gpt-4o
      - claude-3.5-sonnet
      - gemini-1.5-pro
    
    # Programación
    coding:
      - claude-3.5-sonnet
      - gpt-4-turbo
      - deepseek-coder
      - codellama
    
    # Visión
    vision:
      - gpt-4o
      - claude-3.5-sonnet
      - claude-3-opus
      - gemini-1.5-pro
    
    # Rápido (baja latencia)
    fast:
      - gpt-4o-mini
      - claude-3.5-haiku
      - llama-3.1-8b
      - gemini-1.5-flash
    
    # Barato
    cheap:
      - gpt-3.5-turbo
      - mistral-small
      - llama-3.1-8b
      - deepseek-chat
    
    # Contexto largo
    long-context:
      - claude-3.5-sonnet
      - gemini-1.5-pro
      - gemini-1.5-flash
  
  # Configuración de routing
  routing_strategy: latency-based-routing  # latency-based | simple-round-robin | weighted-round-robin
  
  # Fallbacks automáticos
  fallback_config:
    gpt-4o:
      - claude-3.5-sonnet
      - gemini-1.5-pro
    claude-3.5-sonnet:
      - gpt-4o
      - gemini-1.5-pro
    gemini-1.5-pro:
      - claude-3.5-sonnet
      - gpt-4o
  
  # Health checks
  enable_pre_call_checks: true
  health_check_interval: 60
  model_retries: 2
  
  # Rate limiting
  enable_rate_limiting: true
  limits:
    default_limits:
      duration: 60  # segundos
      requests_allowed: 60
      tokens_allowed: 100000

# ---- LITELLM CALL HOOKS ----
# Hooks para logging y transformación
litellm_settings:
  # Call hooks
  call_hooks:
    - name: "audit_logging"
      type: "pre_call"
      function: "hooks.audit_log"
    
    - name: "cost_tracking"
      type: "post_call"
      function: "hooks.track_cost"
  
  # Custom callbacks
  callbacks:
    - langfuse  # Tracing
  
  # Retry settings
  num_retries: 2
  timeout: 60

# ---- UI SETTINGS ----
environment_variables:
  # UI
  LITELLM_UI_USERNAME: "admin"
  LITELLM_UI_PASSWORD: "${LITELLM_UI_PASSWORD}"
  
  # Database
  DATABASE_URL: "${DATABASE_URL}"
  
  # Redis
  REDIS_URL: "${REDIS_URL}"
