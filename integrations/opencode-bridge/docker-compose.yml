# =============================================================================
# opencode-bridge — Docker Compose (Fase 2)
# =============================================================================
# Levanta mi-opencode (servidor headless real, Session API) + opencode-bridge
# (adaptador OpenAI-compatible) en contenedores, con los dos secretos
# compartidos (OPENCODE_SERVER_PASSWORD, BRIDGE_API_KEY) montados como Docker
# secrets basados en archivo — no en texto plano dentro de un .env versionado.
#
# Sigue el mismo patrón que las otras integraciones de esta carpeta
# (ver ../browser-use/docker-compose.yml): un compose file autocontenido por
# integración, con su propia red.
#
# CÓMO CONECTAR ESTO A LibreChat (mi-libre-chat/docker-compose.yml):
#   No se modificó el docker-compose.yml principal de LibreChat porque ese
#   archivo trae el aviso "Do not edit this file directly" en su cabecera.
#   El contenedor `api` de ese compose YA tiene
#   `extra_hosts: host.docker.internal:host-gateway` (ver ese archivo), así
#   que la forma más simple de conectar ambos stacks sin tocar nada es:
#     1. Levantar este stack (expone el bridge en el puerto 8787 del host).
#     2. En librechat.yaml (endpoints.custom), usar:
#          baseURL: 'http://host.docker.internal:8787/v1'
#     3. En el .env de mi-libre-chat, definir OPENCODE_BRIDGE_KEY con el
#        MISMO valor que pusiste en secrets/bridge_api_key.txt.
#   Si preferís unir ambos stacks a una red Docker externa compartida en vez
#   de pasar por el puerto del host, se puede crear una red externa
#   (`docker network create librechat-shared`) y declararla como `external`
#   en ambos compose files — no se hizo por defecto para no obligarte a tocar
#   el compose principal de LibreChat.
#
# ANTES DE USAR:
#   1. cp secrets/opencode_server_password.txt.example secrets/opencode_server_password.txt
#      cp secrets/bridge_api_key.txt.example secrets/bridge_api_key.txt
#      # y reemplazar el contenido de ambos por valores fuertes reales.
#   2. cp .env.example .env
#      # y ajustar OPENCODE_BUILD_CONTEXT si mi-opencode no es un hermano
#      # directo de mi-libre-chat en tu disco (ver ese archivo).
#   3. docker compose up --build
#
# ESTADO DE VERIFICACIÓN: este compose file se revisó a mano (sintaxis YAML
# válida, nombres de servicio/red consistentes con los Dockerfiles) pero NO
# se pudo correr `docker compose up` real en el entorno donde se escribió
# (sin Docker disponible ahí). Falta que lo corras vos y confirmes los 4
# gates de salida de Fase 1 (README_FASE_1.md) ahora en versión Docker.
# =============================================================================

version: '3.8'

services:
  mi-opencode:
    build:
      context: ${OPENCODE_BUILD_CONTEXT:-../../../mi-opencode}
      dockerfile: Dockerfile.dev
    container_name: mi-opencode
    restart: unless-stopped
    environment:
      - PORT=4096
      - HOSTNAME=0.0.0.0
      - OPENCODE_SERVER_PASSWORD_FILE=/run/secrets/opencode_server_password
    secrets:
      - opencode_server_password
    ports:
      # Publicado al host también, útil para debug con curl directo.
      # Quitar si no lo necesitás expuesto fuera de la red de este compose.
      - "${OPENCODE_HOST_PORT:-4096}:4096"
    networks:
      - opencode-bridge-network

  opencode-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode-bridge
    restart: unless-stopped
    environment:
      - OPENCODE_BASE_URL=http://mi-opencode:4096
      - BRIDGE_PORT=8787
      - BRIDGE_MODEL_ID=${BRIDGE_MODEL_ID:-mi-opencode-agent}
      - OPENCODE_SERVER_PASSWORD_FILE=/run/secrets/opencode_server_password
      - BRIDGE_API_KEY_FILE=/run/secrets/bridge_api_key
    secrets:
      - opencode_server_password
      - bridge_api_key
    depends_on:
      mi-opencode:
        condition: service_healthy
    ports:
      - "${BRIDGE_HOST_PORT:-8787}:8787"
    networks:
      - opencode-bridge-network

networks:
  opencode-bridge-network:
    driver: bridge

secrets:
  opencode_server_password:
    file: ./secrets/opencode_server_password.txt
  bridge_api_key:
    file: ./secrets/bridge_api_key.txt
