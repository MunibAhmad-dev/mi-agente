# ===========================================
# Mi LibreChat - Kubernetes Namespace
# ===========================================

apiVersion: v1
kind: Namespace
metadata:
  name: librechat
  labels:
    app: librechat
    environment: production
---
# ConfigMap for non-sensitive config
apiVersion: v1
kind: ConfigMap
metadata:
  name: librechat-config
  namespace: librechat
data:
  NODE_ENV: "production"
  PORT: "3001"
  LOG_LEVEL: "info"
---
# Secret for sensitive config (create separately in production)
apiVersion: v1
kind: Secret
metadata:
  name: librechat-secrets
  namespace: librechat
type: Opaque
stringData:
  MONGO_URI: "mongodb://librechat:CHANGE_ME@mongodb:27017/librechat?authSource=admin"
  REDIS_URL: "redis://redis:6379"
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION"
  CREDS_KEY: "CHANGE_ME_32_CHARS"
  CREDS_IV: "CHANGE_ME_16_CHARS"
