[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "brain"
version = "0.1.0"
description = "BRAIN — A living, inspectable, explainable AI knowledge and memory system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Brain Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pgvector>=0.3.0",

    # AI / Embeddings
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",

    # NER / Extraction
    "spacy>=3.7.0",

    # Reranker
    "sentence-transformers>=3.0.0",

    # LLM Providers
    "httpx>=0.27.0",

    # MCP
    "mcp>=1.0.0",

    # Auth & Security
    "bcrypt>=4.1.0",

    # Validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # Logging
    "structlog>=24.1.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.9.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
pdf = [
    "mineru>=0.1.0",
]
all = [
    "brain[dev,pdf]",
]

[project.scripts]
brain = "brain.cli:main"
brain-mcp = "brain.mcp.__main__:main"
brain-migrate = "brain.cli:migrate"

[project.entry-points."console_scripts"]
brain = "brain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security tests",
    "e2e: End-to-end tests",
]

[tool.coverage.run]
source = ["brain"]
omit = ["tests/*", "brain/migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
