services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: brain
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_buffers=64MB
        -c effective_cache_size=128MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c max_connections=10
        -c fsync=off
        -c full_page_writes=off
        -c synchronous_commit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://brain:brain@postgres:5432/brain
      LLM_PROVIDER: ollama
      LLM_BASE_URL: http://host.docker.internal:11434
      EMBEDDING_DEVICE: cpu
      EMBEDDING_BATCH_SIZE: 16
      LOG_LEVEL: WARNING
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://brain:brain@postgres:5432/brain
      LLM_PROVIDER: ollama
      LLM_BASE_URL: http://host.docker.internal:11434
      EMBEDDING_DEVICE: cpu
      MCP_PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

volumes:
  pgdata:
