<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative AI Orchestrator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
    #root { display: flex; height: 100vh; }
    .sidebar { width: 240px; background: #1e293b; padding: 16px; border-right: 1px solid #334155; display: flex; flex-direction: column; }
    .sidebar h1 { font-size: 16px; color: #60a5fa; margin-bottom: 24px; }
    .sidebar a { display: block; padding: 10px 12px; color: #94a3b8; text-decoration: none; border-radius: 6px; margin-bottom: 4px; font-size: 14px; }
    .sidebar a:hover, .sidebar a.active { background: #334155; color: #e2e8f0; }
    .main { flex: 1; padding: 24px; overflow-y: auto; }
    .main h2 { font-size: 20px; margin-bottom: 16px; color: #f1f5f9; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .card h3 { font-size: 14px; color: #60a5fa; margin-bottom: 8px; }
    .card p { font-size: 13px; color: #94a3b8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge-green { background: #065f46; color: #6ee7b7; }
    .badge-yellow { background: #78350f; color: #fbbf24; }
    .badge-red { background: #7f1d1d; color: #fca5a5; }
    .badge-blue { background: #1e3a5f; color: #93c5fd; }
    .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .input { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px 12px; color: #e2e8f0; font-size: 13px; width: 100%; }
    .input:focus { outline: none; border-color: #2563eb; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #334155; font-size: 13px; }
    th { color: #64748b; font-weight: 600; }
    .status-bar { display: flex; gap: 16px; align-items: center; padding: 8px 16px; background: #1e293b; border-top: 1px solid #334155; font-size: 12px; color: #64748b; }
    .chat-input { display: flex; gap: 8px; margin-top: 16px; }
    .chat-input input { flex: 1; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/ui/app.tsx"></script>
</body>
</html>
