# ArgoCD Application - Crypto AI Trading System
# ====================================
# GitOps con ArgoCD para deployment automático

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crypto-ai-trading
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/aoi555/Sistema-de-IA-para-Inversi-en-Criptomonedas.git
    targetRevision: main
    path: k3s/manifests
    kustomize:
      images:
      - cryptoai/api:latest
      - cryptoai/frontend:latest
  
  destination:
    server: https://kubernetes.default.svc
    namespace: crypto-ai
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  ignoreMissingDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/revision
    - /spec/template/spec/containers/0/image
  
  revisionHistory:
    limit: 10
  
  hooks:
  - name: pre-deploy
    hook:
      generateName: pre-deploy-
      apply:
        manifest: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: pre-deploy-config
          data:
            message: "Pre-deploy hook executed"
    phase: PreSync
    level: Hook
  
  - name: post-deploy
    hook:
      generateName: post-deploy-
      apply:
        manifest: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: post-deploy-config
          data:
            message: "Post-deploy hook executed"
    phase: PostSync
    level: Hook