global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'crypto-ai-system'
    static_configs:
      - targets: 
        - 'prometheus:9090'
        - 'grafana:3000'
    
  - job_name: 'crypto-trading'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'freqtrade'
    
  - job_name: 'n8n'
    static_configs:
      - targets: ['host.docker.internal:5678']
        labels:
          service: 'n8n'
    
  - job_name: 'qdrant'
    static_configs:
      - targets: ['host.docker.internal:6333']
        labels:
          service: 'qdrant'