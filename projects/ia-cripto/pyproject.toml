[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeos"
version = "0.3.0"
description = "Real-World Autonomous Economic AI OS - deterministic economic core"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # stdlib-only core; heavy adapters are optional extras

[project.optional-dependencies]
trading = ["ccxt>=4.0.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["aeos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
