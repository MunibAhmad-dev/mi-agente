<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-OS - Model Browser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #0a0a0f;
      --bg-card: #12121a;
      --bg-hover: #1a1a2e;
      --border: #2a2a3e;
      --text: #e0e0e0;
      --text-dim: #888;
      --accent: #6c5ce7;
      --accent2: #00cec9;
      --green: #00b894;
      --orange: #fdcb6e;
      --red: #e17055;
      --pink: #fd79a8;
      --blue: #74b9ff;
    }
    
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    
    /* Header */
    .header {
      background: linear-gradient(135deg, #12121a 0%, #1a1a2e 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 30px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
    }
    
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo-icon {
      font-size: 32px;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    .logo h1 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .logo-sub {
      font-size: 12px;
      color: var(--text-dim);
    }
    
    /* Search Bar */
    .search-container {
      position: relative;
      max-width: 800px;
    }
    
    .search-input {
      width: 100%;
      padding: 14px 20px 14px 48px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
      outline: none;
      transition: all 0.3s;
    }
    
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(108, 92, 231, 0.3);
    }
    
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      color: var(--text-dim);
    }
    
    /* Filter Buttons */
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    
    .filter-btn {
      padding: 8px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.3s;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .filter-btn:hover {
      background: var(--bg-hover);
      color: var(--text);
      border-color: var(--accent);
    }
    
    .filter-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    
    .filter-btn .count {
      background: rgba(255,255,255,0.2);
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 11px;
    }
    
    /* Source Tabs */
    .source-tabs {
      display: flex;
      gap: 4px;
      margin-top: 12px;
    }
    
    .source-tab {
      padding: 6px 14px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s;
      font-size: 13px;
    }
    
    .source-tab:hover { background: var(--bg-hover); }
    .source-tab.active {
      background: var(--accent);
      color: white;
    }
    
    /* Stats Bar */
    .stats-bar {
      display: flex;
      gap: 24px;
      padding: 12px 30px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-dim);
    }
    
    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .stat-value {
      color: var(--accent2);
      font-weight: 600;
    }
    
    /* Main Content */
    .main {
      display: flex;
      min-height: calc(100vh - 160px);
    }
    
    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      padding: 20px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    
    .sidebar-title {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    
    .sidebar-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 4px;
    }
    
    .sidebar-item:hover {
      background: var(--bg-hover);
    }
    
    .sidebar-item.active {
      background: var(--accent);
      color: white;
    }
    
    .sidebar-count {
      background: rgba(255,255,255,0.15);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
    }
    
    /* Model Grid */
    .model-grid {
      flex: 1;
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      align-content: start;
    }
    
    /* Model Card */
    .model-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.3s;
      cursor: pointer;
      animation: fadeIn 0.5s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .model-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(108, 92, 231, 0.2);
    }
    
    .card-preview {
      height: 160px;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      position: relative;
      overflow: hidden;
    }
    
    .card-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .card-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 10px;
      background: rgba(0,0,0,0.7);
      border-radius: 8px;
      font-size: 11px;
      backdrop-filter: blur(10px);
    }
    
    .card-source {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
    }
    
    .source-huggingface { background: #ffcc00; color: #000; }
    .source-ollama { background: var(--accent2); color: #000; }
    .source-civitai { background: var(--pink); color: #000; }
    .source-github { background: #333; color: #fff; }
    .source-lmstudio { background: var(--blue); color: #000; }
    
    .card-body {
      padding: 16px;
    }
    
    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .card-author {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 12px;
    }
    
    .card-stats {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--text-dim);
    }
    
    .card-stat {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .card-stat .value {
      color: var(--accent2);
      font-weight: 600;
    }
    
    .card-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    
    .tag {
      padding: 3px 8px;
      background: rgba(108, 92, 231, 0.2);
      border-radius: 6px;
      font-size: 11px;
      color: var(--accent);
    }
    
    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      gap: 12px;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Empty State */
    .empty {
      text-align: center;
      padding: 60px;
      color: var(--text-dim);
    }
    
    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    
    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      backdrop-filter: blur(10px);
      animation: fadeIn 0.3s;
    }
    
    .modal-overlay.active { display: flex; align-items: center; justify-content: center; }
    
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      max-width: 800px;
      max-height: 80vh;
      overflow-y: auto;
      width: 90%;
      animation: slideUp 0.3s;
    }
    
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px;
      border-bottom: 1px solid var(--border);
    }
    
    .modal-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      font-size: 18px;
    }
    
    .modal-body { padding: 24px; }
    
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    
    .detail-item {
      background: var(--bg);
      padding: 12px;
      border-radius: 10px;
    }
    
    .detail-label {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    
    .detail-value {
      font-size: 14px;
      font-weight: 600;
    }
    
    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s;
    }
    
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    
    .btn-primary:hover {
      background: #5a4bd1;
      transform: translateY(-2px);
    }
    
    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .model-grid { grid-template-columns: 1fr; }
      .header { padding: 16px; }
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-top">
    <div class="logo">
      <span class="logo-icon">🤖</span>
      <div>
        <h1>AI Model Browser</h1>
        <div class="logo-sub">Universal search across HuggingFace, Ollama, CivitAI, GitHub & more</div>
      </div>
    </div>
  </div>
  
  <!-- Search -->
  <div class="search-container">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" id="searchInput" 
           placeholder="Search models, LoRAs, checkpoints, embeddings..." 
           autocomplete="off">
  </div>
  
  <!-- Filters -->
  <div class="filters" id="filters">
    <button class="filter-btn active" data-category="all">🌐 All</button>
    <button class="filter-btn" data-category="llm">🧠 LLM</button>
    <button class="filter-btn" data-category="image">🎨 Image</button>
    <button class="filter-btn" data-category="audio">🔊 Audio</button>
    <button class="filter-btn" data-category="video">🎬 Video</button>
    <button class="filter-btn" data-category="vision">👁️ Vision</button>
    <button class="filter-btn" data-category="multimodal">🌐 Multimodal</button>
    <button class="filter-btn" data-category="embedding">📐 Embeddings</button>
    <button class="filter-btn" data-category="lora">🔧 LoRA</button>
    <button class="filter-btn" data-category="quantized">📦 Quantized</button>
  </div>
  
  <!-- Source Tabs -->
  <div class="source-tabs" id="sourceTabs">
    <button class="source-tab active" data-source="all">All Sources</button>
    <button class="source-tab" data-source="huggingface">🤗 HuggingFace</button>
    <button class="source-tab" data-source="ollama">🦙 Ollama</button>
    <button class="source-tab" data-source="civitai">🎨 CivitAI</button>
    <button class="source-tab" data-source="github">🐙 GitHub</button>
  </div>
</div>

<!-- Stats -->
<div class="stats-bar">
  <div class="stat-item">📊 Models: <span class="stat-value" id="totalCount">0</span></div>
  <div class="stat-item">🤗 HuggingFace: <span class="stat-value" id="hfCount">0</span></div>
  <div class="stat-item">🦙 Ollama: <span class="stat-value" id="ollamaCount">0</span></div>
  <div class="stat-item">🎨 CivitAI: <span class="stat-value" id="civitaiCount">0</span></div>
  <div class="stat-item">🐙 GitHub: <span class="stat-value" id="githubCount">0</span></div>
  <div class="stat-item">⏱️ <span class="stat-value" id="searchTime">0ms</span></div>
</div>

<!-- Main Content -->
<div class="main">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-title">Categories</div>
    <div id="sidebarCategories"></div>
    
    <div class="sidebar-title" style="margin-top: 24px;">Sources</div>
    <div id="sidebarSources"></div>
    
    <div class="sidebar-title" style="margin-top: 24px;">Popular Tags</div>
    <div id="sidebarTags" style="display: flex; flex-wrap: wrap; gap: 4px;"></div>
  </div>
  
  <!-- Grid -->
  <div class="model-grid" id="modelGrid">
    <div class="loading">
      <div class="spinner"></div>
      <span>Searching AI models...</span>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Model Details</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
// ============================================================
// AI Model Browser - Client
// ============================================================

const API_BASE = 'http://localhost:3456';
let allModels = [];
let currentCategory = 'all';
let currentSource = 'all';
let searchTimeout = null;

// Category icons
const categoryIcons = {
  llm: '🧠', image: '🎨', audio: '🔊', video: '🎬',
  vision: '👁️', multimodal: '🌐', embedding: '📐',
  lora: '🔧', quantized: '📦', unknown: '❓'
};

const sourceIcons = {
  huggingface: '🤗', ollama: '🦙', civitai: '🎨',
  github: '🐙', lmstudio: '🖥️'
};

// ============================================================
// Search
// ============================================================
async function search(query = '', category = 'all', source = 'all') {
  const grid = document.getElementById('modelGrid');
  grid.innerHTML = '<div class="loading"><div class="spinner"></div><span>Searching AI models...</span></div>';
  
  const startTime = Date.now();
  
  try {
    const sources = source === 'all' 
      ? 'huggingface,ollama,civitai,github' 
      : source;
    
    const response = await fetch(
      `${API_BASE}/api/search?q=${encodeURIComponent(query)}&sources=${sources}&category=${category}&limit=50`
    );
    
    const data = await response.json();
    allModels = data.results || [];
    
    updateStats(allModels, Date.now() - startTime);
    renderModels(allModels);
    renderSidebar(allModels);
    
  } catch (e) {
    // Fallback: use built-in data
    console.log('API not available, using built-in data');
    allModels = getBuiltInModels();
    updateStats(allModels, 0);
    renderModels(allModels);
    renderSidebar(allModels);
  }
}

function getBuiltInModels() {
  return [
    // Ollama models
    { id: 'qwen3:1.7b', name: 'Qwen3 1.7B', author: 'Alibaba', source: 'ollama', category: 'llm', sizeGB: '1.0', url: 'https://ollama.com/library/qwen3:1.7b', tags: ['fast', 'coding', 'chinese'] },
    { id: 'qwen3:8b', name: 'Qwen3 8B', author: 'Alibaba', source: 'ollama', category: 'llm', sizeGB: '5.0', url: 'https://ollama.com/library/qwen3:8b', tags: ['coding', 'reasoning'] },
    { id: 'llama3.2:3b', name: 'LLaMA 3.2 3B', author: 'Meta', source: 'ollama', category: 'llm', sizeGB: '2.0', url: 'https://ollama.com/library/llama3.2:3b', tags: ['fast', 'general'] },
    { id: 'llama3.1:8b', name: 'LLaMA 3.1 8B', author: 'Meta', source: 'ollama', category: 'llm', sizeGB: '4.7', url: 'https://ollama.com/library/llama3.1:8b', tags: ['general', 'reasoning'] },
    { id: 'phi4-mini', name: 'Phi-4 Mini', author: 'Microsoft', source: 'ollama', category: 'llm', sizeGB: '2.3', url: 'https://ollama.com/library/phi4-mini', tags: ['fast', 'coding'] },
    { id: 'deepseek-r1:8b', name: 'DeepSeek R1 8B', author: 'DeepSeek', source: 'ollama', category: 'llm', sizeGB: '5.0', url: 'https://ollama.com/library/deepseek-r1:8b', tags: ['reasoning', 'math'] },
    { id: 'gemma3:4b', name: 'Gemma3 4B', author: 'Google', source: 'ollama', category: 'llm', sizeGB: '3.0', url: 'https://ollama.com/library/gemma3:4b', tags: ['general', 'multilingual'] },
    { id: 'minicpm-v', name: 'MiniCPM-V', author: 'OpenBMB', source: 'ollama', category: 'multimodal', sizeGB: '5.5', url: 'https://ollama.com/library/minicpm-v', tags: ['vision', 'multimodal'] },
    { id: 'llava:7b', name: 'LLaVA 7B', author: 'LLaVA Team', source: 'ollama', category: 'multimodal', sizeGB: '4.5', url: 'https://ollama.com/library/llava:7b', tags: ['vision'] },
    { id: 'nomic-embed-text', name: 'Nomic Embed Text', author: 'Nomic AI', source: 'ollama', category: 'embedding', sizeGB: '0.3', url: 'https://ollama.com/library/nomic-embed-text', tags: ['embedding', 'fast'] },
    // Image models
    { id: 'stabilityai/stable-diffusion-xl-base-1.0', name: 'SDXL Base 1.0', author: 'Stability AI', source: 'huggingface', category: 'image', downloads: 500000, likes: 2000, tags: ['stable-diffusion', 'sdxl', 'image-generation'] },
    { id: 'black-forest-labs/FLUX.1-dev', name: 'FLUX.1 Dev', author: 'Black Forest Labs', source: 'huggingface', category: 'image', downloads: 300000, likes: 1500, tags: ['flux', 'image-generation'] },
    { id: 'black-forest-labs/FLUX.1-schnell', name: 'FLUX.1 Schnell', author: 'Black Forest Labs', source: 'huggingface', category: 'image', downloads: 200000, likes: 1000, tags: ['flux', 'fast', 'image-generation'] },
    { id: 'stabilityai/stable-diffusion-3.5-large', name: 'SD 3.5 Large', author: 'Stability AI', source: 'huggingface', category: 'image', downloads: 150000, likes: 800, tags: ['stable-diffusion', 'sd3', 'image-generation'] },
    { id: 'THUDM/CogVideoX-5b', name: 'CogVideoX 5B', author: 'THUDM', source: 'huggingface', category: 'video', downloads: 50000, likes: 400, tags: ['video', 'text-to-video'] },
    { id: 'Wan-AI/Wan2.1-T2V-14B', name: 'Wan 2.1 T2V 14B', author: 'Wan AI', source: 'huggingface', category: 'video', downloads: 30000, likes: 300, tags: ['wan', 'text-to-video'] },
    { id: 'openai/whisper-large-v3', name: 'Whisper Large V3', author: 'OpenAI', source: 'huggingface', category: 'audio', downloads: 400000, likes: 1200, tags: ['whisper', 'speech-to-text'] },
    { id: 'microsoft/phi-4', name: 'Phi-4 14B', author: 'Microsoft', source: 'huggingface', category: 'llm', downloads: 100000, likes: 600, tags: ['reasoning', 'coding'] },
    { id: 'Qwen/Qwen2.5-72B-Instruct', name: 'Qwen2.5 72B Instruct', author: 'Alibaba', source: 'huggingface', category: 'llm', downloads: 80000, likes: 500, tags: ['instruct', 'large'] },
    { id: 'meta-llama/Llama-3.1-405B-Instruct', name: 'Llama 3.1 405B', author: 'Meta', source: 'huggingface', category: 'llm', downloads: 60000, likes: 400, tags: ['large', 'instruct'] },
  ];
}

// ============================================================
// Render
// ============================================================
function renderModels(models) {
  const grid = document.getElementById('modelGrid');
  
  if (!models.length) {
    grid.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><h3>No models found</h3><p>Try a different search or filter</p></div>';
    return;
  }
  
  grid.innerHTML = models.map((m, i) => `
    <div class="model-card" onclick="showDetails(${i})" style="animation-delay: ${i * 50}ms">
      <div class="card-preview">
        <span>${categoryIcons[m.category] || '🤖'}</span>
        <span class="card-source source-${m.source}">${sourceIcons[m.source] || '📦'} ${m.source}</span>
        ${m.rating ? `<span class="card-badge">⭐ ${(m.rating).toFixed(1)}</span>` : ''}
      </div>
      <div class="card-body">
        <div class="card-title" title="${m.id}">${m.name}</div>
        <div class="card-author">${m.author || 'Unknown'} ${m.sizeGB ? `• ${m.sizeGB}GB` : ''}</div>
        <div class="card-stats">
          ${m.downloads ? `<div class="card-stat">📥 <span class="value">${formatNumber(m.downloads)}</span></div>` : ''}
          ${m.likes ? `<div class="card-stat">❤️ <span class="value">${formatNumber(m.likes)}</span></div>` : ''}
          ${m.stars ? `<div class="card-stat">⭐ <span class="value">${formatNumber(m.stars)}</span></div>` : ''}
          ${m.forks ? `<div class="card-stat">🍴 <span class="value">${formatNumber(m.forks)}</span></div>` : ''}
        </div>
        <div class="card-tags">
          ${(m.tags || []).slice(0, 4).map(t => `<span class="tag">${t}</span>`).join('')}
        </div>
      </div>
    </div>
  `).join('');
}

function renderSidebar(models) {
  // Categories
  const catCounts = {};
  models.forEach(m => {
    catCounts[m.category] = (catCounts[m.category] || 0) + 1;
  });
  
  const catHtml = Object.entries(catCounts)
    .sort((a, b) => b[1] - a[1])
    .map(([cat, count]) => `
      <div class="sidebar-item ${currentCategory === cat ? 'active' : ''}" onclick="filterCategory('${cat}')">
        <span>${categoryIcons[cat] || '📦'} ${cat}</span>
        <span class="sidebar-count">${count}</span>
      </div>
    `).join('');
  
  document.getElementById('sidebarCategories').innerHTML = catHtml;
  
  // Sources
  const srcCounts = {};
  models.forEach(m => {
    srcCounts[m.source] = (srcCounts[m.source] || 0) + 1;
  });
  
  const srcHtml = Object.entries(srcCounts)
    .sort((a, b) => b[1] - a[1])
    .map(([src, count]) => `
      <div class="sidebar-item ${currentSource === src ? 'active' : ''}" onclick="filterSource('${src}')">
        <span>${sourceIcons[src] || '📦'} ${src}</span>
        <span class="sidebar-count">${count}</span>
      </div>
    `).join('');
  
  document.getElementById('sidebarSources').innerHTML = srcHtml;
  
  // Tags
  const tagCounts = {};
  models.forEach(m => (m.tags || []).forEach(t => {
    tagCounts[t] = (tagCounts[t] || 0) + 1;
  }));
  
  const topTags = Object.entries(tagCounts)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 20)
    .map(([tag, count]) => `<span class="tag" style="cursor:pointer" onclick="searchByTag('${tag}')">${tag} (${count})</span>`);
  
  document.getElementById('sidebarTags').innerHTML = topTags.join('');
}

function updateStats(models, time) {
  document.getElementById('totalCount').textContent = models.length;
  document.getElementById('hfCount').textContent = models.filter(m => m.source === 'huggingface').length;
  document.getElementById('ollamaCount').textContent = models.filter(m => m.source === 'ollama').length;
  document.getElementById('civitaiCount').textContent = models.filter(m => m.source === 'civitai').length;
  document.getElementById('githubCount').textContent = models.filter(m => m.source === 'github').length;
  document.getElementById('searchTime').textContent = time + 'ms';
}

// ============================================================
// Interactions
// ============================================================
function filterCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-category="${cat}"]`)?.classList.add('active');
  
  let filtered = allModels;
  if (cat !== 'all') filtered = filtered.filter(m => m.category === cat);
  if (currentSource !== 'all') filtered = filtered.filter(m => m.source === currentSource);
  renderModels(filtered);
}

function filterSource(src) {
  currentSource = src;
  document.querySelectorAll('.source-tab').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-source="${src}"]`)?.classList.add('active');
  
  let filtered = allModels;
  if (currentCategory !== 'all') filtered = filtered.filter(m => m.category === currentCategory);
  if (src !== 'all') filtered = filtered.filter(m => m.source === src);
  renderModels(filtered);
}

function searchByTag(tag) {
  document.getElementById('searchInput').value = tag;
  search(tag, currentCategory, currentSource);
}

function showDetails(index) {
  const m = allModels[index];
  if (!m) return;
  
  document.getElementById('modalTitle').textContent = m.name;
  document.getElementById('modalBody').innerHTML = `
    <div class="detail-grid">
      <div class="detail-item">
        <div class="detail-label">Model ID</div>
        <div class="detail-value">${m.id}</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Author</div>
        <div class="detail-value">${m.author || 'Unknown'}</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Source</div>
        <div class="detail-value">${sourceIcons[m.source] || ''} ${m.source}</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Category</div>
        <div class="detail-value">${categoryIcons[m.category] || ''} ${m.category}</div>
      </div>
      ${m.sizeGB ? `<div class="detail-item"><div class="detail-label">Size</div><div class="detail-value">${m.sizeGB}GB</div></div>` : ''}
      ${m.downloads ? `<div class="detail-item"><div class="detail-label">Downloads</div><div class="detail-value">${formatNumber(m.downloads)}</div></div>` : ''}
      ${m.likes ? `<div class="detail-item"><div class="detail-label">Likes</div><div class="detail-value">${formatNumber(m.likes)}</div></div>` : ''}
      ${m.stars ? `<div class="detail-item"><div class="detail-label">Stars</div><div class="detail-value">${formatNumber(m.stars)}</div></div>` : ''}
      ${m.rating ? `<div class="detail-item"><div class="detail-label">Rating</div><div class="detail-value">⭐ ${m.rating.toFixed(1)}</div></div>` : ''}
    </div>
    <div style="margin-bottom: 16px;">
      <div class="detail-label">Tags</div>
      <div class="card-tags" style="margin-top: 8px;">
        ${(m.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}
      </div>
    </div>
    <div style="display: flex; gap: 12px;">
      <a href="${m.url}" target="_blank" class="btn btn-primary" style="text-decoration:none;">Open in ${m.source}</a>
      <button class="btn btn-secondary" onclick="installModel('${m.id}', '${m.source}')">📥 Install</button>
      <button class="btn btn-secondary" onclick="closeModal()">Close</button>
    </div>
  `;
  
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

function installModel(id, source) {
  if (source === 'ollama') {
    alert(`To install: ollama pull ${id}`);
  } else {
    alert(`Model: ${id}\nVisit: ${allModels.find(m => m.id === id)?.url || ''}`);
  }
}

function formatNumber(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return n.toString();
}

// ============================================================
// Event Listeners
// ============================================================

// Search input
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    search(e.target.value, currentCategory, currentSource);
  }, 500);
});

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    filterCategory(btn.dataset.category);
  });
});

// Source tabs
document.querySelectorAll('.source-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    filterSource(tab.dataset.source);
  });
});

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});

// Keyboard shortcut
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
  if (e.key === 'Escape') closeModal();
});

// ============================================================
// Init
// ============================================================
search('');
</script>

</body>
</html>
