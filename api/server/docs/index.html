<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi LibreChat API - Documentación</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui.css">
  <style>
    :root {
      --primary-color: #3b82f6;
      --secondary-color: #1e40af;
      --accent-color: #06b6d4;
    }
    
    body {
      margin: 0;
      padding: 0;
    }
    
    .swagger-ui .topbar {
      background-color: var(--primary-color);
      padding: 10px 20px;
    }
    
    .swagger-ui .topbar .topbar-wrapper {
      max-width: 1460px;
      margin: 0 auto;
    }
    
    .swagger-ui .topbar .topbar-wrapper a {
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
    }
    
    .swagger-ui .topbar .topbar-wrapper a span {
      margin-left: 10px;
    }
    
    .info .title {
      color: var(--primary-color) !important;
    }
    
    .scheme-container {
      background-color: #f8fafc !important;
    }
    
    .btn {
      background-color: var(--primary-color) !important;
    }
    
    .btn.authorize {
      background-color: var(--accent-color) !important;
    }
    
    /* Loading animation */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .loading-container h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    
    .loading-container p {
      font-size: 1.2rem;
      opacity: 0.9;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-top: 20px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="swagger-ui" class="loading-container">
    <h1>🤖 Mi LibreChat</h1>
    <p>Cargando documentación de la API...</p>
    <div class="spinner"></div>
  </div>

  <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      // Obtener la URL del spec
      const specUrl = './openapi.yaml';
      
      const ui = SwaggerUIBundle({
        url: specUrl,
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "StandaloneLayout",
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 1,
        docExpansion: 'list',
        filter: true,
        showExtensions: true,
        showCommonExtensions: true,
        requestInterceptor: function(request) {
          // Agregar headers si es necesario
          return request;
        },
        responseInterceptor: function(response) {
          console.log('Response received:', response.status);
          return response;
        },
        onComplete: function() {
          console.log('Swagger UI loaded');
          document.body.classList.remove('loading-container');
        }
      });

      window.ui = ui;
    };
  </script>
</body>
</html>
